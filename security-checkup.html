<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyberora - Security Checkup</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="checker-page">

        <h1>🔐 Security Checkup</h1>

        <p>
            Check some basic security habits and improve your online safety.
        </p>

        <div class="security-card">

            <h2>🔑 Strong Passwords</h2>

            <label>
                <input type="checkbox" class="security-check">
                I use strong and unique passwords.
            </label>

        </div>

        <div class="security-card">

            <h2>🛡️ Two-Factor Authentication</h2>

            <label>
                <input type="checkbox" class="security-check">
                I use two-factor authentication where available.
            </label>

        </div>

        <div class="security-card">

            <h2>📱 Device Updates</h2>

            <label>
                <input type="checkbox" class="security-check">
                My device and important apps are updated.
            </label>

        </div>

        <div class="security-card">

            <h2>🔒 Screen Lock</h2>

            <label>
                <input type="checkbox" class="security-check">
                My device has a secure screen lock.
            </label>

        </div>

        <div class="security-card">

            <h2>⚠️ Suspicious Apps</h2>

            <label>
                <input type="checkbox" class="security-check">
                I review and remove apps I don't trust.
            </label>

        </div>

        <button id="checkSecurityBtn">
            Check My Security
        </button>

        <div id="securityResult"></div>

        <a href="dashboard.html">← Back to Dashboard</a>

    </main>

    <script src="script.js"></script>

</body>

</html>
