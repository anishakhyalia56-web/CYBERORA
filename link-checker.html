<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyberora - Link Safety Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="checker-page">

        <h1>🔗 Link Safety Checker</h1>

        <p>
            Check a website link for common safety warning signs.
        </p>

        <input
            type="url"
            id="linkInput"
            placeholder="Paste a website link"
        >

        <button id="checkLinkBtn">
            Check Link
        </button>

        <div id="result"></div>

        <a href="dashboard.html">← Back to Dashboard</a>

    </main>
    <script src="script.js"> </script>
</body>
</html>
