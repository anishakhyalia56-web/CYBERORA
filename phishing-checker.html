<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyberora - Phishing / Scam Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="checker-page">

        <h1>🎣 Phishing / Scam Checker</h1>

        <p>
            Check a message for common phishing and scam warning signs.
        </p>

        <textarea
            id="messageInput"
            placeholder="Paste a suspicious message here"
            rows="8"
        ></textarea>

        <button id="checkMessageBtn">
            Check Message
        </button>

        <div id="messageResult"></div>

        <a href="dashboard.html">← Back to Dashboard</a>

    </main>

    <script src="script.js"></script>

</body>
</html>
