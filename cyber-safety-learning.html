<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyberora - Cyber Safety Learning</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="checker-page">

        <h1>📚 Cyber Safety Learning</h1>

        <p>
            Learn simple habits that can help you stay safer online.
        </p>

        <button class="learning-card"
        onclick="showLesson('passwordLesson')">

            <h2>🔐 Strong Passwords</h2>

            <p>
                Use long, unique passwords for important accounts.
                Avoid using the same password everywhere.
            </p>

            <h3>🛡️ Safety Tip</h3>

            <p>
                Never share your password with other people.
            </p>

        </button>

        <button class="learning-card"
        onclick="showLesson('otpLesson')">

            <h2>🔢 Protect Your OTP & PIN</h2>

            <p>
                OTPs, UPI PINs and card PINs are private security information.
            </p>

            <h3>🛡️ Safety Tip</h3>

            <p>
                Never share them with anyone, even if someone claims to
                be from a bank or company.
            </p>

        </button>

        <button class="learning-card"
        onclick="showLesson('linkLesson')">

            <h2>🔗 Check Links Before Clicking</h2>

            <p>
                Suspicious links can lead to fake websites or harmful pages.
            </p>

            <h3>🛡️ Safety Tip</h3>

            <p>
                Check the website address carefully and use official websites
                or apps when possible.
            </p>

        </button>

        <button class="learning-card"
        onclick="showLesson('updateLesson')">

            <h2>📱 Keep Devices Updated</h2>

            <p>
                Updates can include important security fixes for your device
                and applications.
            </p>

            <h3>🛡️ Safety Tip</h3>

            <p>
                Install updates from trusted sources and keep your important
                apps updated.
            </p>

        </button>

        <button class="learning-card"
        onclick="showLesson('trustLesson')">

            <h2>⚠️ Think Before You Trust</h2>

            <p>
                Scammers often create urgency, fear or excitement to make
                people act quickly.
            </p>

            <h3>🛡️ Safety Tip</h3>

            <p>
                Stop, think and independently verify unexpected requests.
            </p>

        </button>

        <a href="dashboard.html">← Back to Dashboard</a>

    </main>
    <script src="script.js"> </script>

</body>

</html>
