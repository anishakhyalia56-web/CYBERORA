<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyberora - Digital Safety Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome-page">

        <div class="logo-container">
            <img src="logo.jpeg" alt="Cyberora Logo">
        </div>

        <h1 style="display:block !important; color:#00bcd4 !important;font-size: 44px !important; visibility:visible 
        !important; opacity:1 !important;">
         Cyberora
        </h1>

        <p class="tagline">Your Digital Safety Assistant</p>

        <p class="welcome-text">
            Stay safer online with simple and helpful digital safety tools.
        </p>

        <div class="email-box">

            <label for="email">Enter your email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                autocomplete="email"
            >

            <button id="continueBtn" disabled>
                Continue
            </button>

            <p id="emailMessage"></p>

        </div>

        <p class="privacy-note">
            🔒 Your information should be handled securely and responsibly.
        </p>

    <footer class="main-footer">
      © 2026 Cyberora — Created by Anisha Khyalia
    </footer>
    </main>

    <script src="script.js"></script>

</body>
</html>
